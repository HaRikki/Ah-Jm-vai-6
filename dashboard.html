<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — AngKer SMM</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <button id="menuBtn" class="btn" style="background:transparent;padding:6px;color:var(--text);">☰</button>
    <img class="logo" src="/images/logo-ak.png" alt="AngKer" />
    <div>
      <div id="headerName" style="font-weight:700;font-size:14px;">User</div>
      <div class="text-muted">Welcome to panel!</div>
    </div>
    <div class="balance-pill">💰 <span id="headerBalance">$0.00</span></div>
  </header>

  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar">
    <div style="padding:16px;display:flex;gap:10px;align-items:center;">
      <img src="/images/logo-ak.png" width="36" height="36" alt="" />
      <div>
        <div style="font-weight:700;">AngKer SMM</div>
        <div id="sideBalance" class="text-muted"></div>
      </div>
    </div>
    <nav>
      <a class="menu-item active" href="/dashboard.html">Dashboard</a>
      <a class="menu-item" href="/new-order.html">New order</a>
      <a class="menu-item" href="/orders.html">Orders</a>
      <a class="menu-item" href="/add-balance.html">Add funds</a>
      <a class="menu-item" href="/services.html">Services</a>
      <a class="menu-item" href="/admin.html" id="adminLink" class="hidden">Admin</a>
      <a class="menu-item" href="#" id="logoutBtn">Logout</a>
    </nav>
  </aside>

  <main class="container">
    <h1 style="font-size:20px;margin-bottom:16px;">Dashboard</h1>
    <div class="panel" style="margin-bottom:12px;">
      <div class="text-muted">Balance</div>
      <div id="dashBalance" style="font-size:28px;font-weight:800;color:var(--primary);">$0.00</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      <div class="panel"><div class="text-muted">Total Orders</div><div id="statTotal" style="font-weight:700;font-size:20px;">0</div></div>
      <div class="panel"><div class="text-muted">Pending</div><div id="statPending" style="font-weight:700;font-size:20px;">0</div></div>
      <div class="panel"><div class="text-muted">Completed</div><div id="statCompleted" style="font-weight:700;font-size:20px;">0</div></div>
      <div class="panel"><div class="text-muted">Failed</div><div id="statFailed" style="font-weight:700;font-size:20px;">0</div></div>
    </div>
    <h2 style="font-size:16px;margin-bottom:8px;">Recent Orders</h2>
    <div id="recentOrders"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    UI.initTheme();
    if (!UI.requireLogin()) throw 0;
    UI.initSidebar();
    UI.refreshUserHeader().then(() => {
      const u = AK.getUser();
      if (u) {
        document.getElementById('dashBalance').textContent = UI.formatMoney(u.balance);
        document.getElementById('sideBalance').textContent = UI.formatMoney(u.balance);
        if (['admin','superadmin','manager'].includes(u.role)) {
          document.getElementById('adminLink').classList.remove('hidden');
        }
      }
    });
    (async () => {
      const { ok, data } = await AK.api('/api/orders?limit=10');
      if (!ok) return;
      const orders = data.orders || [];
      document.getElementById('statTotal').textContent = data.pagination?.total || orders.length;
      document.getElementById('statPending').textContent = orders.filter(o => o.status==='pending'||o.status==='processing').length;
      document.getElementById('statCompleted').textContent = orders.filter(o => o.status==='completed').length;
      document.getElementById('statFailed').textContent = orders.filter(o => o.status==='failed').length;
      const box = document.getElementById('recentOrders');
      if (!orders.length) {
        box.innerHTML = '<div class="panel text-center text-muted">No orders yet</div>';
        return;
      }
      box.innerHTML = orders.map(o => `
        <div class="panel" style="margin-bottom:8px;">
          <div style="display:flex;justify-content:space-between;gap:8px;">
            <div style="font-weight:600;font-size:13px;">${o.service}</div>
            <span class="status-badge status-${o.status}">${o.status}</span>
          </div>
          <div class="text-muted">${UI.formatMoney(o.price)} · Qty ${o.quantity}</div>
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
