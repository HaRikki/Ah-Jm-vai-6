<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders — AngKer SMM</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="header">
    <a href="/dashboard.html" style="color:var(--text);padding:6px;">←</a>
    <img class="logo" src="/images/logo-ak.png" alt="" />
    <div style="font-weight:700;">Orders</div>
  </header>
  <main class="container">
    <div class="field"><select class="input" id="statusFilter">
      <option value="">All status</option>
      <option value="pending">Pending</option>
      <option value="processing">Processing</option>
      <option value="completed">Completed</option>
      <option value="failed">Failed</option>
      <option value="partial">Partial</option>
    </select></div>
    <div id="list"></div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    UI.initTheme();
    if (!UI.requireLogin()) throw 0;
    async function load() {
      const st = document.getElementById('statusFilter').value;
      const q = st ? `?status=${st}` : '';
      const { ok, data } = await AK.api('/api/orders' + q);
      const list = document.getElementById('list');
      if (!ok || !data.orders?.length) {
        list.innerHTML = '<div class="panel text-center text-muted">No orders</div>';
        return;
      }
      list.innerHTML = data.orders.map(o => `
        <div class="panel" style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;">
            <strong style="font-size:13px;">${o.service}</strong>
            <span class="status-badge status-${o.status}">${o.status}</span>
          </div>
          <div class="text-muted">${o.id.slice(0,12)}…</div>
          <div class="text-muted">Qty ${o.quantity} · ${UI.formatMoney(o.price)}</div>
          ${o.providerOrderId ? `<div class="text-muted">Provider #${o.providerOrderId}</div>` : ''}
        </div>
      `).join('');
    }
    document.getElementById('statusFilter').addEventListener('change', load);
    load();
  </script>
</body>
</html>
